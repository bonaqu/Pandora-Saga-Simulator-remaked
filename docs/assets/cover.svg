<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Pandora Saga Simulator — Restored</title>
  <desc id="desc">Green retro-inspired cover for the restored Pandora Saga character simulator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10150d"/>
      <stop offset="0.55" stop-color="#162313"/>
      <stop offset="1" stop-color="#0c100a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaffdc"/>
      <stop offset="1" stop-color="#c2ff96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1440" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="1270" cy="76" r="180" fill="#7ec640" opacity="0.08"/>
  <circle cx="1180" cy="520" r="250" fill="#b5ff7f" opacity="0.05"/>

  <g transform="translate(82 84)">
    <text x="0" y="42" font-family="Verdana, Arial, sans-serif" font-size="19" letter-spacing="5" fill="#9ff360">PRESERVATION BUILD</text>
    <text x="0" y="116" font-family="Verdana, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fff3">Pandora Saga</text>
    <text x="0" y="178" font-family="Verdana, Arial, sans-serif" font-size="56" font-weight="700" fill="#b5ff7f">Simulator</text>
    <text x="2" y="226" font-family="Verdana, Arial, sans-serif" font-size="22" fill="#d7e8ce">Restored legacy character calculator • static • self-contained</text>

    <g transform="translate(0 282)">
      <rect x="0" y="0" width="184" height="42" rx="7" fill="#7ec640"/>
      <text x="92" y="27" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">GITHUB PAGES</text>
      <rect x="198" y="0" width="148" height="42" rx="7" fill="#24331f" stroke="#7ec640"/>
      <text x="272" y="27" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#c2ff96">NO BACKEND</text>
      <rect x="360" y="0" width="126" height="42" rx="7" fill="#24331f" stroke="#7ec640"/>
      <text x="423" y="27" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="15" font-weight="700" fill="#c2ff96">v2.00</text>
    </g>
  </g>

  <g transform="translate(830 64)" filter="url(#shadow)">
    <rect width="500" height="430" rx="18" fill="#f8fff3" stroke="#7ec640" stroke-width="2"/>
    <rect x="18" y="18" width="464" height="42" rx="8" fill="#7ec640"/>
    <text x="36" y="45" font-family="Verdana, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff">Pandora Saga Simulator</text>

    <g transform="translate(18 78)">
      <rect width="214" height="150" rx="8" fill="url(#panel)" stroke="#aee587"/>
      <text x="14" y="27" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="700" fill="#4c8210">CHARACTER</text>
      <text x="14" y="57" font-family="monospace" font-size="13" fill="#5d6a57">Level</text><text x="188" y="57" text-anchor="end" font-family="monospace" font-size="13" fill="#3b6c00">50</text>
      <text x="14" y="82" font-family="monospace" font-size="13" fill="#5d6a57">Strength</text><text x="188" y="82" text-anchor="end" font-family="monospace" font-size="13" fill="#3b6c00">75</text>
      <text x="14" y="107" font-family="monospace" font-size="13" fill="#5d6a57">Agility</text><text x="188" y="107" text-anchor="end" font-family="monospace" font-size="13" fill="#3b6c00">48</text>
      <rect x="14" y="124" width="174" height="10" rx="5" fill="#dfffc8"/>
      <rect x="14" y="124" width="123" height="10" rx="5" fill="#7ec640"/>
    </g>

    <g transform="translate(250 78)">
      <rect width="232" height="150" rx="8" fill="#fff" stroke="#aee587"/>
      <text x="14" y="27" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="700" fill="#4c8210">COMBAT</text>
      <g font-family="monospace" font-size="13" fill="#5d6a57">
        <text x="14" y="58">Attack</text><text x="205" y="58" text-anchor="end" fill="#3b6c00">431</text>
        <text x="14" y="84">Defense</text><text x="205" y="84" text-anchor="end" fill="#3b6c00">298</text>
        <text x="14" y="110">Accuracy</text><text x="205" y="110" text-anchor="end" fill="#3b6c00">167</text>
      </g>
    </g>

    <g transform="translate(18 246)">
      <rect width="464" height="166" rx="8" fill="#fff" stroke="#aee587"/>
      <text x="14" y="29" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="700" fill="#4c8210">SKILLS / EQUIPMENT / OPTIONS</text>
      <g transform="translate(14 49)">
        <rect width="436" height="24" rx="4" fill="#edffe0"/>
        <rect width="291" height="24" rx="4" fill="#7ec640" opacity="0.8"/>
        <text x="8" y="17" font-family="monospace" font-size="12" fill="#314328">Slash</text>
      </g>
      <g transform="translate(14 82)">
        <rect width="436" height="24" rx="4" fill="#edffe0"/>
        <rect width="214" height="24" rx="4" fill="#8fdd50" opacity="0.75"/>
        <text x="8" y="17" font-family="monospace" font-size="12" fill="#314328">Defense</text>
      </g>
      <g transform="translate(14 115)">
        <rect width="436" height="24" rx="4" fill="#edffe0"/>
        <rect width="344" height="24" rx="4" fill="#9ff360" opacity="0.7"/>
        <text x="8" y="17" font-family="monospace" font-size="12" fill="#314328">Horsemanship</text>
      </g>
    </g>
  </g>

  <text x="82" y="520" font-family="Verdana, Arial, sans-serif" font-size="14" fill="#8ea584">bonaqu / Pandora-Saga-Simulator-remaked</text>
</svg>
