name: One-shot Modern 3.15 localization sync

on:
  push:
    branches:
      - i18n/modern-3.15-ru-labels-layout

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/modern-3.15-ru-labels-layout
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install exporter dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium --with-deps --only-shell
          python -m pip install --disable-pip-version-check openpyxl

      - name: Refresh deterministic Legacy term export
        run: |
          python scripts/build_pages.py --output _site
          npm run extract:terms

      - name: Sync workbook rows and requested translations
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import json
          import pathlib
          from openpyxl import load_workbook

          root = pathlib.Path.cwd()
          workbook_path = root / "localization" / "translations.xlsx"
          ui_en = json.loads((root / "localization" / "ui.en.json").read_text(encoding="utf-8"))
          game = json.loads((root / "localization" / "game-terms.ru.json").read_text(encoding="utf-8"))["terms"]

          category_names = {
              "race": "Раса",
              "racial_skill": "Расовый навык",
              "job": "Класс",
              "skill": "Группа навыков",
              "skill_entry": "Навык",
              "equipment_category": "Категория экипировки",
              "equipment": "Предмет",
              "soul": "Soul",
              "calculator_label": "Подпись калькулятора",
              "calculator_hint": "Подсказка калькулятора",
              "skill_detail": "Описание навыка",
          }

          wb = load_workbook(workbook_path)
          ws = wb["Переводы"]
          by_id = {str(ws.cell(row=r, column=2).value or ""): r for r in range(2, ws.max_row + 1)}

          ui_template = next(r for r in range(2, ws.max_row + 1) if ws.cell(r, 1).value == "Интерфейс")
          game_template = next(r for r in range(2, ws.max_row + 1) if ws.cell(r, 1).value == "Игра")

          expected = {}
          for identifier, source in ui_en.items():
              expected[identifier] = ["Интерфейс", identifier, "Интерфейс сайта", "", source, "", "", "", ""]
          for term in game:
              expected[term["id"]] = [
                  "Игра", term["id"], category_names.get(term["category"], term["category"]),
                  term["legacy_path"], term["source_en"], term["source_jp"], term["source_tw"], "", ""
              ]

          def append_row(values, template_row):
              ws.append(values)
              row = ws.max_row
              for col in range(1, 10):
                  src = ws.cell(template_row, col)
                  dst = ws.cell(row, col)
                  dst._style = copy.copy(src._style)
                  dst.font = copy.copy(src.font)
                  dst.fill = copy.copy(src.fill)
                  dst.border = copy.copy(src.border)
                  dst.alignment = copy.copy(src.alignment)
                  dst.number_format = src.number_format
                  dst.protection = copy.copy(src.protection)
              return row

          for identifier, values in expected.items():
              if identifier not in by_id:
                  row = append_row(values, ui_template if values[0] == "Интерфейс" else game_template)
                  by_id[identifier] = row

          # Verify immutable source columns after adding only genuinely new IDs.
          for identifier, values in expected.items():
              row = by_id[identifier]
              stable_cols = 5 if values[0] == "Интерфейс" else 7
              actual = [str(ws.cell(row, col).value or "") for col in range(1, stable_cols + 1)]
              source = [str(value or "") for value in values[:stable_cols]]
              if actual != source:
                  raise SystemExit(f"Source columns differ for {identifier}: {actual!r} != {source!r}")

          ru = {
              "calculator.status.11": "Сопр УРОНСПИН",
              "calculator.status.12": "Сопр ФИЗ",
              "calculator.status.21": "Сопр КРУРОН",
              "calculator.status.40": "Сопр АНОМТЕЛ",
              "calculator.status.41": "Сопр АНООМДУХ",

              "calculator.status.0.hint": "Очки Здоровья",
              "calculator.status.1.hint": "Очки Маны",
              "calculator.status.5.hint": "Текущий максимальный показатель атаки",
              "calculator.status.9.hint": "Очки Защиты; Уменьшение получаемого физического урона",
              "calculator.status.15.hint": "Очки Точности; Точность попадания по цели",
              "calculator.status.19.hint": "Очки Уклонения; Шанс уклониться от атаки",
              "calculator.status.33.hint": "Время перезарядки умений",

              "calculator.gem.1.6": "Радуга",
              "calculator.slot.4": "Броня",
              "calculator.slot.7": "Обувь",
              "calculator.slot.9": "Серьга",
              "calculator.text.26": "Сброс",
              "equipment_category.31": "Броня",
              "equipment_category.34": "Обувь",
              "equipment_category.40": "Серьга",

              "calculator.text.0": "Раса",
              "calculator.text.1": "Пасивн",
              "calculator.text.2": "Класс",
              "calculator.tab.0": "КЛАСС",
              "calculator.tab.1": "УМЕНИЯ",
              "calculator.tab.2": "АТАКА",
              "calculator.tab.3": "ЗАЩИТА",
              "calculator.tab.4": "УСИЛЕНИЯ",

              "equipment.reset": "Сброс",
          }
          for identifier, value in ru.items():
              ws.cell(by_id[identifier], 8).value = value

          # The compact reset button is a Modern UI string, so all UI locales
          # get a short caption independent of the retained Legacy source text.
          reset_row = by_id["equipment.reset"]
          ws.cell(reset_row, 6).value = "リセット"
          ws.cell(reset_row, 7).value = "重設"
          ws.cell(reset_row, 8).value = "Сброс"

          end_row = ws.max_row
          for table in ws.tables.values():
              table.ref = f"A1:I{end_row}"
              if table.autoFilter is not None:
                  table.autoFilter.ref = f"A1:I{end_row}"

          wb.save(workbook_path)
          print(f"Workbook now contains {end_row - 1} translation rows.")
          PY

      - name: Validate generated localization
        run: |
          python scripts/translation_workbook.py --root .
          npm run test:translations
          python -m unittest tests.test_translation_workbook -v

      - name: Commit localization and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/game-terms.ru.json localization/translations.xlsx
          git rm .github/workflows/modern-3.15-localization-sync.yml
          git commit -m "i18n: sync Modern 3.15 workbook terms"
          git push origin HEAD:i18n/modern-3.15-ru-labels-layout
