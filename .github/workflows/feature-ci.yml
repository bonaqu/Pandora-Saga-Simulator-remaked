name: Feature CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - bonaqu_projects

permissions:
  contents: read

concurrency:
  group: feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      css_only: ${{ steps.changes.outputs.css_only }}
      full_required: ${{ steps.changes.outputs.full_required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin bonaqu_projects --depth=1
            base="$(git merge-base HEAD origin/bonaqu_projects)"
          fi

          mapfile -t files < <(git diff --name-only "$base"...HEAD)
          docs_only=true
          css_only=true

          if [[ ${#files[@]} -eq 0 ]]; then
            docs_only=false
            css_only=false
          fi

          for file in "${files[@]}"; do
            case "$file" in
              *.md|docs/*|.github/ISSUE_TEMPLATE/*)
                ;;
              *)
                docs_only=false
                ;;
            esac

            case "$file" in
              modern/*.css|tests/ui/*.spec.mjs|tests/ui/helpers/*.mjs|*.md|docs/*|.github/ISSUE_TEMPLATE/*)
                ;;
              *)
                css_only=false
                ;;
            esac
          done

          if [[ "$docs_only" == "true" || "$css_only" == "true" ]]; then
            full_required=false
          else
            full_required=true
          fi

          printf 'docs_only=%s\ncss_only=%s\nfull_required=%s\n' \
            "$docs_only" "$css_only" "$full_required" >> "$GITHUB_OUTPUT"

          printf 'Changed files (%d):\n' "${#files[@]}"
          printf ' - %s\n' "${files[@]}"
          echo "docs_only=$docs_only css_only=$css_only full_required=$full_required"

  browser_site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build browser-test site once
        run: python3 scripts/build_pages.py --output _site

      - name: Upload browser-test site
        uses: actions/upload-artifact@v4
        with:
          name: feature-browser-site
          path: _site
          if-no-files-found: error
          retention-days: 1

  static:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up project Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Validate restored simulator
        run: python3 scripts/validate_site.py

      - name: Syntax-check core JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in             js/calc.js js/equip.js js/item.js js/skill.js js/ini.js             modern/version.js modern/i18n.js modern/adapter.js modern/catalog.js             modern/admin-entry.js modern/calculator-labels.js modern/game-term-display.js             modern/build-store.js modern/search.js modern/equipment-picker.js             modern/calculator-controls.js modern/skill-controls.js modern/skill-tooltips.js             modern/builds.js modern/app-shell.js modern/tooltips.js modern/compare.js             modern/mobile.js modern/pwa.js modern/service-worker.js             scripts/lib/legacy-runtime.mjs scripts/serve_pages.mjs             scripts/extract_legacy_terms.mjs scripts/extract_legacy_data.mjs
          do
            node --check "$file"
          done

  workspace_visual:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium


      - name: Run complete desktop workspace contract
        id: workspace
        run: |
          mkdir -p .ci-artifacts
          npm run test:ui:desktop -- --project=chromium --reporter=json > .ci-artifacts/workspace-report.json

      - name: Verify deterministic Legacy terminology export
        run: npm run test:translations

      - name: Verify pure current skill reference reconciliation
        run: npm run test:source-audit

      - name: Verify deterministic structured data projections
        run: npm run test:data

      - name: Capture desktop and mobile visual QA
        id: visual
        run: npm run test:ui:visual -- --project=chromium

      - name: Upload workspace and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-workspace-visual
          path: |
            .ci-artifacts/workspace-report.json
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 1

  browser_core:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium


      - name: Run browser contract shard ${{ matrix.shard }}/3
        id: browser
        shell: bash
        run: |
          mkdir -p .ci-artifacts
          npm run test:ui:ci -- --project=chromium --shard=${{ matrix.shard }}/3 --reporter=json > .ci-artifacts/browser-report-${{ matrix.shard }}.json

      - name: Upload browser shard ${{ matrix.shard }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-browser-report-${{ matrix.shard }}
          path: |
            .ci-artifacts/browser-report-${{ matrix.shard }}.json
            test-results/**/test-failed-*.png
          if-no-files-found: warn
          retention-days: 1

  catalog_audit:
    needs: classify
    if: needs.classify.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PW_FULLY_PARALLEL: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium


      - name: Audit source catalog shard ${{ matrix.shard }}/2
        run: npm run test:ui:catalog-audit -- --shard=${{ matrix.shard }}/2

  catalog_contract:
    needs: classify
    if: needs.classify.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium


      - name: Verify versioned catalog calculations shard ${{ matrix.shard }}/2
        run: >
          npm run test:ui --
          tests/ui/catalog-adapter.spec.mjs
          tests/ui/catalog-adoption.spec.mjs
          tests/ui/build-load-races.spec.mjs
          tests/ui/skill-catalog.spec.mjs
          tests/ui/skill-variants.spec.mjs
          tests/ui/custom-skill-learning.spec.mjs
          tests/ui/skill-profiles.spec.mjs
          tests/ui/native-passive-effects.spec.mjs
          tests/ui/build-context.spec.mjs
          tests/ui/admin-entry.spec.mjs
          --project=chromium
          --shard=${{ matrix.shard }}/2

      - name: Verify admin editor with synthetic sessions only
        if: matrix.shard == 1
        run: npm run test:ui:admin

  cross_browser:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run ${{ matrix.browser }} smoke tests
        run: npx playwright test tests/ui/cross-browser-smoke.spec.mjs --project=${{ matrix.browser }}-smoke

  cross_browser_webkit:
    needs:
      - classify
      - browser_site
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      PW_PREBUILT_SITE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Download prebuilt browser-test site
        uses: actions/download-artifact@v4
        with:
          name: feature-browser-site
          path: _site

      - name: Verify pinned Playwright runtime
        run: |
          node --version
          npx playwright --version
          test "$PLAYWRIGHT_BROWSERS_PATH" = "/ms-playwright"

      - name: Run webkit smoke tests
        run: npx playwright test tests/ui/cross-browser-smoke.spec.mjs --project=webkit-smoke

  test:
    if: always()
    needs:
      - classify
      - static
      - workspace_visual
      - browser_core
      - catalog_audit
      - catalog_contract
      - cross_browser
      - cross_browser_webkit
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable CI partition
        shell: bash
        env:
          CLASSIFY: ${{ needs.classify.result }}
          STATIC: ${{ needs.static.result }}
          WORKSPACE: ${{ needs.workspace_visual.result }}
          CORE: ${{ needs.browser_core.result }}
          CATALOG_AUDIT: ${{ needs.catalog_audit.result }}
          CATALOG_CONTRACT: ${{ needs.catalog_contract.result }}
          CROSS_BROWSER: ${{ needs.cross_browser.result }}
          CROSS_BROWSER_WEBKIT: ${{ needs.cross_browser_webkit.result }}
        run: |
          set -euo pipefail
          for result in "$CLASSIFY" "$STATIC" "$WORKSPACE" "$CORE" "$CATALOG_AUDIT" "$CATALOG_CONTRACT" "$CROSS_BROWSER" "$CROSS_BROWSER_WEBKIT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A required CI partition ended as: $result"
              exit 1
            fi
          done
          echo "All applicable Feature CI partitions passed."
