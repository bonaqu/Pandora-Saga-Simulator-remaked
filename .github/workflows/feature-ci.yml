name: Feature CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - bonaqu_projects

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      css_only: ${{ steps.changes.outputs.css_only }}
      full_required: ${{ steps.changes.outputs.full_required }}
      ci_profile: ${{ steps.changes.outputs.ci_profile }}
      translation_only: ${{ steps.changes.outputs.translation_only }}
      catalog_data: ${{ steps.changes.outputs.catalog_data }}
      admin_only: ${{ steps.changes.outputs.admin_only }}
      duplicate_pr: ${{ steps.changes.outputs.duplicate_pr }}
    steps:
      - name: Detect open PR for feature push
        id: dedupe
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          count="$(gh api --method GET "repos/$REPOSITORY/pulls" \
            -f state=open \
            -f base=bonaqu_projects \
            -f head="$OWNER:$BRANCH" \
            --jq 'length')"
          if [[ "$count" -gt 0 ]]; then
            echo "duplicate_pr=true" >> "$GITHUB_OUTPUT"
            echo "Open PR already validates $BRANCH; skipping duplicate push matrix."
          else
            echo "duplicate_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.dedupe.outputs.duplicate_pr != 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          DUPLICATE_PR: ${{ steps.dedupe.outputs.duplicate_pr }}
        run: |
          set -euo pipefail
          if [[ "$DUPLICATE_PR" == "true" ]]; then
            printf 'docs_only=true\ncss_only=false\nfull_required=false\nci_profile=duplicate-pr\ntranslation_only=false\ncatalog_data=false\nadmin_only=false\nduplicate_pr=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            git fetch origin bonaqu_projects --depth=1
            base="$(git merge-base HEAD origin/bonaqu_projects)"
          fi

          mapfile -t files < <(git diff --name-only "$base"...HEAD)
          policy_json="$(printf '%s\n' "${files[@]}" | python3 scripts/deploy_change_policy.py --stdin)"
          policy_mode="$(jq -r '.mode' <<<"$policy_json")"
          policy_profile="$(jq -r '.ci_profile' <<<"$policy_json")"
          docs_only=false
          if [[ "$policy_mode" == "docs-only" || "$policy_mode" == "release-notes" ]]; then
            docs_only=true
          fi

          translation_only=false
          catalog_data=false
          admin_only=false
          case "$policy_profile" in
            translation) translation_only=true ;;
            catalog) catalog_data=true ;;
            admin) admin_only=true ;;
          esac

          css_only=true
          release_notes_required=false
          changelog_changed=false
          if [[ ${#files[@]} -eq 0 ]]; then
            css_only=false
          fi

          for file in "${files[@]}"; do
            if [[ "$file" == "CHANGELOG.md" ]]; then
              changelog_changed=true
            fi

            case "$file" in
              modern/*|js/*|css/*|image/*|data/*|localization/*|index.html|scripts/build_pages.py)
                release_notes_required=true
                ;;
            esac

            case "$file" in
              modern/*.css|css/*|image/*|tests/ui/*.spec.mjs|tests/ui/helpers/*.mjs|*.md|docs/*|.github/ISSUE_TEMPLATE/*|tests/test_repository_docs.py|tests/test_deploy_change_policy.py)
                ;;
              *)
                css_only=false
                ;;
            esac
          done

          if [[ "${{ github.event_name }}" == "pull_request" && "$docs_only" != "true" && "$release_notes_required" == "true" && "$changelog_changed" != "true" ]]; then
            echo "::error::User-facing runtime/UI changes require an accompanying CHANGELOG.md update."
            echo "Update the latest dated Modern release so the site version and What's new panel stay in sync."
            exit 1
          fi

          if [[ "$docs_only" == "true" || "$css_only" == "true" || "$translation_only" == "true" || "$catalog_data" == "true" || "$admin_only" == "true" ]]; then
            full_required=false
          else
            full_required=true
          fi

          printf 'docs_only=%s\ncss_only=%s\nfull_required=%s\nci_profile=%s\ntranslation_only=%s\ncatalog_data=%s\nadmin_only=%s\nduplicate_pr=false\n' \
            "$docs_only" "$css_only" "$full_required" "$policy_profile" "$translation_only" "$catalog_data" "$admin_only" >> "$GITHUB_OUTPUT"

          printf 'Changed files (%d):\n' "${#files[@]}"
          printf ' - %s\n' "${files[@]}"
          echo "policy=$policy_json"
          echo "docs_only=$docs_only css_only=$css_only ci_profile=$policy_profile translation_only=$translation_only catalog_data=$catalog_data admin_only=$admin_only full_required=$full_required release_notes_required=$release_notes_required changelog_changed=$changelog_changed"

  browser_site:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.translation_only != 'true' && needs.classify.outputs.catalog_data != 'true' && needs.classify.outputs.admin_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build browser-test site once
        run: python3 scripts/build_pages.py --output _site

      - name: Upload browser-test site
        uses: actions/upload-artifact@v4
        with:
          name: feature-browser-site
          path: _site
          if-no-files-found: error
          retention-days: 1

  static:
    needs: classify
    if: needs.classify.outputs.duplicate_pr != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up project Node runtime
        if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.translation_only != 'true' && needs.classify.outputs.catalog_data != 'true' && needs.classify.outputs.admin_only != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Run documentation and release-note tests
        if: needs.classify.outputs.docs_only == 'true'
        run: >
          python -m unittest -v
          tests.test_repository_docs
          tests.test_build_pages
          tests.test_deploy_change_policy

      - name: Run focused change-policy checks
        if: needs.classify.outputs.translation_only == 'true' || needs.classify.outputs.catalog_data == 'true' || needs.classify.outputs.admin_only == 'true'
        run: >
          python -m unittest -v
          tests.test_repository_docs
          tests.test_build_pages
          tests.test_deploy_change_policy

      - name: Run full Python tests
        if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.translation_only != 'true' && needs.classify.outputs.catalog_data != 'true' && needs.classify.outputs.admin_only != 'true'
        run: python -m unittest discover -s tests -v

      - name: Verify compact Modern build code and catalog descriptions
        if: needs.classify.outputs.docs_only != 'true'
        run: npm run test:modern-build-code

      - name: Validate restored simulator
        if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.admin_only != 'true'
        run: python3 scripts/validate_site.py

      - name: Syntax-check core JavaScript
        if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.translation_only != 'true' && needs.classify.outputs.catalog_data != 'true' && needs.classify.outputs.admin_only != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for file in             js/calc.js js/equip.js js/item.js js/skill.js js/ini.js             modern/version.js modern/i18n.js modern/adapter.js modern/catalog.js modern/catalog-text.js modern/identity-aliases.js modern/share-codec.js modern/enhancement-effects.js             modern/admin-entry.js modern/calculator-labels.js modern/game-term-display.js             modern/build-store.js modern/search.js modern/equipment-picker.js             modern/calculator-controls.js modern/skill-controls.js modern/skill-tooltips.js             modern/builds.js modern/app-shell.js modern/tooltips.js modern/compare.js             modern/mobile.js modern/pwa.js modern/service-worker.js             scripts/lib/legacy-runtime.mjs scripts/serve_pages.mjs             scripts/extract_legacy_terms.mjs scripts/extract_legacy_data.mjs
          do
            node --check "$file"
          done

      - name: Install admin test dependencies
        if: needs.classify.outputs.full_required == 'true'
        run: npm ci --no-audit --no-fund

      - name: Verify admin editor with synthetic sessions only
        if: needs.classify.outputs.full_required == 'true'
        env:
          PW_USE_SYSTEM_CHROME: '1'
        run: npm run test:ui:admin

  workspace_visual:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.translation_only != 'true' && needs.classify.outputs.catalog_data != 'true' && needs.classify.outputs.admin_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium --with-deps --only-shell


      - name: Run complete desktop workspace contract
        id: workspace
        run: |
          mkdir -p .ci-artifacts
          npm run test:ui:desktop -- --project=chromium --reporter=json > .ci-artifacts/workspace-report.json

      - name: Verify deterministic Legacy terminology export
        run: npm run test:translations

      - name: Verify pure current skill reference reconciliation
        run: npm run test:source-audit

      - name: Verify deterministic structured data projections
        run: npm run test:data

      - name: Capture desktop and mobile visual QA
        id: visual
        run: npm run test:ui:visual -- --project=chromium

      - name: Upload workspace and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-workspace-visual
          path: |
            .ci-artifacts/workspace-report.json
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 1

  browser_core:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.translation_only != 'true' && needs.classify.outputs.catalog_data != 'true' && needs.classify.outputs.admin_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium --with-deps --only-shell


      - name: Run browser contract shard ${{ matrix.shard }}/3
        id: browser
        shell: bash
        run: |
          mkdir -p .ci-artifacts
          if ! npm run test:ui:ci -- --project=chromium --shard=${{ matrix.shard }}/3 --reporter=json > .ci-artifacts/browser-report-${{ matrix.shard }}.json; then
            node -e 'const fs=require("node:fs");const p=process.argv[1];try{const j=JSON.parse(fs.readFileSync(p,"utf8"));const visit=s=>{for(const t of s.tests||[]){for(const r of t.results||[])if(r.status!=="passed"&&r.status!=="skipped")console.log("TEST:",s.title,t.projectName||"",r.status,(r.error?.message||"").slice(0,1400));}for(const sub of s.suites||[])visit(sub)};for(const s of j.suites||[])visit(s);console.log("SUMMARY:",JSON.stringify(j.stats));}catch(e){console.error("Cannot summarize Playwright report:",e.message)}' .ci-artifacts/browser-report-${{ matrix.shard }}.json
            exit 1
          fi

      - name: Upload browser shard ${{ matrix.shard }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-browser-report-${{ matrix.shard }}
          path: |
            .ci-artifacts/browser-report-${{ matrix.shard }}.json
            test-results/**/test-failed-*.png
          if-no-files-found: warn
          retention-days: 1

  catalog_audit:
    needs: classify
    if: needs.classify.outputs.full_required == 'true' || needs.classify.outputs.catalog_data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PW_FULLY_PARALLEL: '1'
      PW_USE_SYSTEM_CHROME: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund


      - name: Audit source catalog shard ${{ matrix.shard }}/2
        run: npm run test:ui:catalog-audit -- --shard=${{ matrix.shard }}/2

  catalog_contract:
    needs: classify
    if: needs.classify.outputs.full_required == 'true' || needs.classify.outputs.catalog_data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PW_USE_SYSTEM_CHROME: '1'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund


      - name: Verify versioned catalog calculations shard ${{ matrix.shard }}/2
        run: >
          npm run test:ui --
          tests/ui/catalog-adapter.spec.mjs
          tests/ui/catalog-adoption.spec.mjs
          tests/ui/modern-current-builds.spec.mjs
          tests/ui/equipment-enhancement-effects.spec.mjs
          tests/ui/data-projections.spec.mjs
          tests/ui/item-preview.spec.mjs
          tests/ui/equipment-picker.spec.mjs
          tests/ui/build-load-races.spec.mjs
          tests/ui/skill-catalog.spec.mjs
          tests/ui/skill-variants.spec.mjs
          tests/ui/custom-skill-learning.spec.mjs
          tests/ui/skill-profiles.spec.mjs
          tests/ui/native-passive-effects.spec.mjs
          tests/ui/build-context.spec.mjs
          tests/ui/admin-entry.spec.mjs
          --project=chromium
          --shard=${{ matrix.shard }}/2

  data_integrity:
    needs: classify
    if: needs.classify.outputs.translation_only == 'true' || needs.classify.outputs.catalog_data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify deterministic translation projection
        run: npm run test:translations

      - name: Verify deterministic catalog projections
        if: needs.classify.outputs.catalog_data == 'true'
        run: |
          npm run test:data
          npm run test:source-audit

  admin_contract:
    needs: classify
    if: needs.classify.outputs.admin_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Admin API contracts
        run: npm run test:admin

      - name: Verify Wrangler build
        run: npm run admin:check

  cross_browser:
    needs: classify
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.admin_only != 'true'
    runs-on: ubuntu-latest
    env:
      PW_USE_SYSTEM_CHROME: '1'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run chromium smoke tests
        run: npx playwright test tests/ui/cross-browser-smoke.spec.mjs --project=chromium-smoke

      - name: Run focused localization contract
        if: needs.classify.outputs.translation_only == 'true'
        run: >
          npx playwright test
          tests/ui/localization.spec.mjs
          tests/ui/game-term-display.spec.mjs
          tests/ui/data-projections.spec.mjs
          --project=chromium

  cross_browser_firefox:
    needs:
      - classify
      - browser_site
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.translation_only != 'true' && needs.classify.outputs.catalog_data != 'true' && needs.classify.outputs.admin_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      PW_PREBUILT_SITE: '1'
      HOME: /root
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Download prebuilt browser-test site
        uses: actions/download-artifact@v4
        with:
          name: feature-browser-site
          path: _site

      - name: Verify pinned Playwright runtime
        run: |
          node --version
          npx playwright --version
          test "$PLAYWRIGHT_BROWSERS_PATH" = "/ms-playwright"
          test "$HOME" = "/root"

      - name: Run firefox smoke tests
        run: npx playwright test tests/ui/cross-browser-smoke.spec.mjs --project=firefox-smoke

  cross_browser_webkit:
    needs:
      - classify
      - browser_site
    if: needs.classify.outputs.docs_only != 'true' && needs.classify.outputs.translation_only != 'true' && needs.classify.outputs.catalog_data != 'true' && needs.classify.outputs.admin_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      PW_PREBUILT_SITE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Download prebuilt browser-test site
        uses: actions/download-artifact@v4
        with:
          name: feature-browser-site
          path: _site

      - name: Verify pinned Playwright runtime
        run: |
          node --version
          npx playwright --version
          test "$PLAYWRIGHT_BROWSERS_PATH" = "/ms-playwright"

      - name: Run webkit smoke tests
        run: npx playwright test tests/ui/cross-browser-smoke.spec.mjs --project=webkit-smoke

  test:
    if: always()
    needs:
      - classify
      - static
      - workspace_visual
      - browser_core
      - catalog_audit
      - catalog_contract
      - data_integrity
      - admin_contract
      - cross_browser
      - cross_browser_firefox
      - cross_browser_webkit
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable CI partition
        shell: bash
        env:
          CLASSIFY: ${{ needs.classify.result }}
          STATIC: ${{ needs.static.result }}
          WORKSPACE: ${{ needs.workspace_visual.result }}
          CORE: ${{ needs.browser_core.result }}
          CATALOG_AUDIT: ${{ needs.catalog_audit.result }}
          CATALOG_CONTRACT: ${{ needs.catalog_contract.result }}
          DATA_INTEGRITY: ${{ needs.data_integrity.result }}
          ADMIN_CONTRACT: ${{ needs.admin_contract.result }}
          CROSS_BROWSER: ${{ needs.cross_browser.result }}
          CROSS_BROWSER_FIREFOX: ${{ needs.cross_browser_firefox.result }}
          CROSS_BROWSER_WEBKIT: ${{ needs.cross_browser_webkit.result }}
        run: |
          set -euo pipefail
          for result in "$CLASSIFY" "$STATIC" "$WORKSPACE" "$CORE" "$CATALOG_AUDIT" "$CATALOG_CONTRACT" "$DATA_INTEGRITY" "$ADMIN_CONTRACT" "$CROSS_BROWSER" "$CROSS_BROWSER_FIREFOX" "$CROSS_BROWSER_WEBKIT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "A required CI partition ended as: $result"
              exit 1
            fi
          done
          echo "All applicable Feature CI partitions passed."
