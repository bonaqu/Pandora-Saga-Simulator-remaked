name: Feature CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - bonaqu_projects

permissions:
  contents: write

concurrency:
  group: feature-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up project Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate preservation baseline when bootstrapping
        id: baseline
        shell: bash
        run: |
          if [[ ! -f preservation/legacy-files.sha256 ]]; then
            python3 scripts/legacy_fingerprint.py --write preservation/legacy-files.sha256
            echo 'created=true' >> "$GITHUB_OUTPUT"
          else
            echo 'created=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Validate restored simulator
        run: python3 scripts/validate_site.py

      - name: Syntax-check core JavaScript
        shell: bash
        run: |
          node --check js/calc.js
          node --check js/equip.js
          node --check js/item.js
          node --check js/skill.js
          node --check js/ini.js
          node --check modern/version.js
          node --check modern/i18n.js
          node --check modern/adapter.js
          node --check modern/catalog.js
          node --check modern/admin-entry.js
          node --check modern/calculator-labels.js
          node --check modern/game-term-display.js
          node --check modern/build-store.js
          node --check modern/search.js
          node --check modern/equipment-picker.js
          node --check modern/calculator-controls.js
          node --check modern/skill-controls.js
          node --check modern/skill-tooltips.js
          node --check modern/builds.js
          node --check modern/app-shell.js
          node --check modern/tooltips.js
          node --check modern/compare.js
          node --check modern/mobile.js
          node --check modern/pwa.js
          node --check modern/service-worker.js
          node --check scripts/lib/legacy-runtime.mjs
          node --check scripts/serve_pages.mjs
          node --check scripts/extract_legacy_terms.mjs
          node --check scripts/extract_legacy_data.mjs

      - name: Install browser test dependencies
        id: npm
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
            echo 'lock_created=false' >> "$GITHUB_OUTPUT"
          else
            npm install --no-audit --no-fund
            echo 'lock_created=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install Playwright browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      # Keep the platform-sensitive workspace gate early and separate, not
      # duplicated in the long main suite. Its failure evidence survives.
      - name: Run complete desktop workspace contract
        id: workspace_contract
        shell: bash
        run: |
          mkdir -p .ci-artifacts
          npm run test:ui:desktop -- --reporter=json > .ci-artifacts/workspace-report.json

      - name: Upload desktop workspace evidence
        if: ${{ always() && steps.workspace_contract.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-desktop-workspace
          path: |
            .ci-artifacts/workspace-report.json
            test-results/desktop-workspace-*/desktop-workspace.png
            test-results/desktop-workspace-*/test-failed-*.png
            test-results/hybrid-composition-*/hybrid-*.png
            test-results/hybrid-composition-*/test-failed-*.png
          if-no-files-found: error
          retention-days: 1

      - name: Run shipped browser contract tests
        id: browser_contract
        shell: bash
        run: |
          mkdir -p .ci-artifacts
          npm run test:ui:ci -- --reporter=json > .ci-artifacts/browser-report.json

      - name: Upload native panel and input visual evidence
        if: ${{ always() && steps.browser_contract.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-native-panels
          path: |
            .ci-artifacts/browser-report.json
            test-results/panel-workspace-*/**/*.png
            test-results/compact-inputs-*/**/*.png
            test-results/skill-tooltips-*/**/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Verify deterministic Legacy terminology export
        run: npm run test:translations

      - name: Verify pure current skill reference reconciliation
        run: npm run test:source-audit

      - name: Audit every selectable source catalog record against the museum
        run: npm run test:ui:catalog-audit

      - name: Verify admin editor with synthetic sessions only
        run: npm run test:ui:admin

      - name: Verify versioned catalog calculations and offline recipients
        id: catalog_contract
        shell: bash
        run: |
          mkdir -p .ci-artifacts
          npm run test:ui -- tests/ui/catalog-adapter.spec.mjs tests/ui/catalog-adoption.spec.mjs tests/ui/build-load-races.spec.mjs tests/ui/skill-catalog.spec.mjs tests/ui/skill-variants.spec.mjs tests/ui/custom-skill-learning.spec.mjs tests/ui/native-passive-effects.spec.mjs tests/ui/build-context.spec.mjs tests/ui/admin-entry.spec.mjs --project=chromium --reporter=json > .ci-artifacts/catalog-report.json

      # Capture the populated skill view before the next Playwright batch
      # clears test-results. All catalog sessions and records here are synthetic.
      - name: Upload versioned catalog evidence
        if: ${{ always() && steps.catalog_contract.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-catalog-evidence
          path: |
            .ci-artifacts/catalog-report.json
            test-results/**/skill-additions-*.png
            test-results/**/test-failed-*.png
          if-no-files-found: error
          retention-days: 1

      - name: Run Chromium Firefox and WebKit smoke tests
        run: npm run test:ui:cross-browser

      - name: Syntax-check recovered archived codecs
        run: |
          node --check _site/js/base64.js
          node --check _site/js/rawinflate.js
          node --check _site/js/rawdeflate.js

      - name: Verify deterministic structured data projections
        run: npm run test:data

      - name: Upload browser contract report
        if: ${{ always() && steps.browser_contract.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: feature-browser-report
          path: .ci-artifacts/browser-report.json
          if-no-files-found: error
          retention-days: 1

      - name: Capture desktop and mobile visual QA
        run: npm run test:ui:visual

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: feature-visual-qa
          path: test-results/**/modern-*.png
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated bootstrap metadata once
        if: github.event_name == 'push' && (steps.baseline.outputs.created == 'true' || steps.npm.outputs.lock_created == 'true')
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preservation/legacy-files.sha256 package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: lock modernization test metadata"
          git push origin HEAD:${GITHUB_REF_NAME}
