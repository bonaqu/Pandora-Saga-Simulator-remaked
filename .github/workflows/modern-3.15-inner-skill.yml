name: One-shot inner Skill translation

on:
  push:
    branches:
      - i18n/modern-3.15-ru-labels-layout

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/modern-3.15-ru-labels-layout

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Patch workbook
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, zipfile
          from xml.etree import ElementTree
          from scripts.translation_workbook import MAIN_NS, read_rows

          workbook = pathlib.Path("localization/translations.xlsx")
          rows = read_rows(workbook)
          row_number = next(index for index, row in enumerate(rows, start=1) if row[1] == "calculator.learn.0")
          rewritten = workbook.with_suffix(".changed.xlsx")
          with zipfile.ZipFile(workbook) as source, zipfile.ZipFile(rewritten, "w") as target:
              for entry in source.infolist():
                  payload = source.read(entry.filename)
                  if entry.filename == "xl/worksheets/sheet1.xml":
                      sheet = ElementTree.fromstring(payload)
                      row = sheet.find(f".//{{{MAIN_NS}}}row[@r='{row_number}']")
                      ref = f"H{row_number}"
                      cell = row.find(f"{{{MAIN_NS}}}c[@r='{ref}']")
                      if cell is None:
                          cell = ElementTree.SubElement(row, f"{{{MAIN_NS}}}c", {"r": ref})
                      cell.clear()
                      cell.attrib.update({"r": ref, "t": "inlineStr"})
                      inline = ElementTree.SubElement(cell, f"{{{MAIN_NS}}}is")
                      ElementTree.SubElement(inline, f"{{{MAIN_NS}}}t").text = "Умения"
                      payload = ElementTree.tostring(sheet, encoding="utf-8", xml_declaration=True)
                  target.writestr(entry, payload)
          rewritten.replace(workbook)
          PY
          python scripts/translation_workbook.py --root .
          python -m unittest tests.test_translation_workbook -v

      - name: Commit workbook and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add localization/translations.xlsx
          git rm .github/workflows/modern-3.15-inner-skill.yml
          git commit -m "i18n: translate inner Skill heading"
          git push origin HEAD:i18n/modern-3.15-ru-labels-layout
