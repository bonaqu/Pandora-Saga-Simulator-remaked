name: Deploy Pandora Saga Simulator

on:
  push:
    branches:
      - bonaqu_projects
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: https://github.com/palver1/Pandora_saga_tools.git
  SOURCE_COMMIT: 2a2417335f8dd8145c4558f663ca6a0746ca70c6
  SOURCE_PATH: ps_simulator/PSS_original

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Reuse exact successful PR validation when possible
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          full_validation=true
          source_pr=""
          source_head=""

          if [[ "$EVENT_NAME" == "push" ]]; then
            prs="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$REPOSITORY/commits/$DEPLOY_SHA/pulls")"

            source_pr="$(jq -r '
              map(select(.merged_at != null and .base.ref == "bonaqu_projects"))
              | first
              | .number // empty
            ' <<<"$prs")"

            if [[ -n "$source_pr" ]]; then
              pr="$(gh api "repos/$REPOSITORY/pulls/$source_pr")"
              source_head="$(jq -r '.head.sha' <<<"$pr")"

              runs="$(gh api \
                "repos/$REPOSITORY/actions/workflows/feature-ci.yml/runs?head_sha=$source_head&event=pull_request&status=completed&per_page=20")"

              if jq -e '.workflow_runs | any(.conclusion == "success")' <<<"$runs" >/dev/null; then
                full_validation=false
                echo "Exact PR head $source_head already passed Feature CI; using the fast production gate."
              else
                echo "No successful Feature CI found for exact PR head $source_head; keeping full production validation."
              fi
            else
              echo "No merged PR is associated with $DEPLOY_SHA; keeping full production validation."
            fi
          else
            echo "Manual deployment requested; keeping full production validation."
          fi

          {
            echo "full_validation=$full_validation"
            echo "source_pr=$source_pr"
            echo "source_head=$source_head"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout preservation repository
        uses: actions/checkout@v7
        with:
          ref: bonaqu_projects
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up project Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Import recovered simulator once
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f .source-imported ]]; then
            echo "Recovered simulator is already committed locally; skipping upstream import."
            exit 0
          fi

          workdir="$(mktemp -d)"
          source_dir="$workdir/source"

          git init "$source_dir"
          git -C "$source_dir" remote add origin "$SOURCE_REPOSITORY"
          git -C "$source_dir" sparse-checkout init --cone
          git -C "$source_dir" sparse-checkout set "$SOURCE_PATH"
          git -C "$source_dir" fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD

          recovered="$source_dir/$SOURCE_PATH"
          test -f "$recovered/Pandora Saga Simulator.htm"
          test -d "$recovered/js"
          test -d "$recovered/css"
          test -d "$recovered/image"

          rm -rf css js image
          cp -a "$recovered/css" ./css
          cp -a "$recovered/js" ./js
          cp -a "$recovered/image" ./image
          cp "$recovered/Pandora Saga Simulator.htm" ./index.html

          python3 scripts/strip_fc2_injection.py index.html

          cat > SOURCE.lock <<EOF
          source_repository=$SOURCE_REPOSITORY
          source_commit=$SOURCE_COMMIT
          source_path=$SOURCE_PATH
          original_url=http://pansaga3.web.fc2.com/simu/
          imported_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          touch .source-imported

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .source-imported SOURCE.lock index.html css js image

          if git diff --cached --quiet; then
            echo "Nothing to commit after import."
          else
            git commit -m "preservation: import original Pandora Saga Simulator snapshot"
            git push origin HEAD:bonaqu_projects
          fi

      - name: Run fast production unit checks
        run: python -m unittest discover -s tests -v

      - name: Validate preservation snapshot
        run: python3 scripts/validate_site.py

      - name: Syntax-check legacy and Modern JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for file in             js/calc.js js/equip.js js/item.js js/skill.js js/ini.js             modern/version.js modern/i18n.js modern/adapter.js modern/catalog.js             modern/admin-entry.js modern/calculator-labels.js modern/game-term-display.js             modern/build-store.js modern/search.js modern/equipment-picker.js             modern/calculator-controls.js modern/skill-controls.js modern/builds.js             modern/app-shell.js modern/tooltips.js modern/compare.js modern/mobile.js             modern/pwa.js modern/service-worker.js scripts/lib/legacy-runtime.mjs             scripts/serve_pages.mjs scripts/extract_legacy_terms.mjs scripts/extract_legacy_data.mjs
          do
            node --check "$file"
          done

      - name: Build Modern and Legacy Pages routes
        run: python3 scripts/build_pages.py --output _site

      - name: Verify Pages defaults to English
        run: python3 scripts/check_default_language.py _site/index.html

      - name: Syntax-check recovered archived codecs
        run: |
          node --check _site/js/base64.js
          node --check _site/js/rawinflate.js
          node --check _site/js/rawdeflate.js

      - name: Install browser test dependencies
        run: npm ci --no-audit --no-fund

      - name: Run lightweight production smoke gate with runner Chrome
        env:
          PW_USE_SYSTEM_CHROME: '1'
        run: >
          npx playwright test
          tests/ui/modern-foundation.spec.mjs
          --project=chromium
          --grep
          "Modern shell exposes meaningful navigation and defaults to English|Modern and Legacy routes load without missing local assets"

      - name: Install bundled browsers for fallback validation
        if: steps.gate.outputs.full_validation == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run complete desktop workspace contract on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: npm run test:ui:desktop -- --project=chromium

      - name: Run shipped browser contract tests on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: npm run test:ui:ci -- --project=chromium

      - name: Audit every selectable source catalog record on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: npm run test:ui:catalog-audit

      - name: Verify versioned catalog calculations on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: >
          npm run test:ui --
          tests/ui/catalog-adapter.spec.mjs
          tests/ui/catalog-adoption.spec.mjs
          tests/ui/build-load-races.spec.mjs
          tests/ui/skill-catalog.spec.mjs
          tests/ui/skill-variants.spec.mjs
          tests/ui/custom-skill-learning.spec.mjs
          tests/ui/skill-profiles.spec.mjs
          tests/ui/native-passive-effects.spec.mjs
          tests/ui/build-context.spec.mjs
          tests/ui/admin-entry.spec.mjs
          --project=chromium

      - name: Run cross-browser smoke tests on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: npm run test:ui:cross-browser

      - name: Run visual QA on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: npm run test:ui:visual -- --project=chromium

      - name: Verify deterministic lightweight projections
        run: |
          npm run test:translations
          npm run test:source-audit
          npm run test:data

      - name: Report validation path
        run: |
          echo "full_validation=${{ steps.gate.outputs.full_validation }}"
          echo "source_pr=${{ steps.gate.outputs.source_pr }}"
          echo "source_head=${{ steps.gate.outputs.source_head }}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  wiki:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout documentation
        uses: actions/checkout@v7
        with:
          ref: bonaqu_projects

      - name: Best-effort sync documentation to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          wiki_dir="$(mktemp -d)/wiki"
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          git clone "$wiki_url" "$wiki_dir"
          clone_status=$?
          if [[ $clone_status -ne 0 ]]; then
            echo "::notice::Wiki git repository is not initialized or the workflow token cannot write it. Canonical docs remain in /docs."
            exit 0
          fi

          rm -f "$wiki_dir/test.md" "$wiki_dir/Test.md"

          cp docs/wiki/Home.md "$wiki_dir/Home.md"
          cp docs/FAQ.md "$wiki_dir/FAQ.md"
          cp docs/ARCHITECTURE.md "$wiki_dir/Architecture.md"
          cp docs/DEPLOYMENT.md "$wiki_dir/Deployment.md"
          cp docs/HISTORY.md "$wiki_dir/History.md"

          cd "$wiki_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki already matches repository documentation."
            exit 0
          fi

          git commit -m "docs: sync preservation wiki"
          git push origin HEAD
          push_status=$?
          if [[ $push_status -ne 0 ]]; then
            echo "::notice::Wiki sync could not push; simulator deployment is unaffected."
          fi
          exit 0
