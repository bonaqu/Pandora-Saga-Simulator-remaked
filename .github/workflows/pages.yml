name: Deploy Pandora Saga Simulator

on:
  push:
    branches:
      - bonaqu_projects
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      pages_required: ${{ steps.gate.outputs.pages_required }}
      wiki_required: ${{ steps.gate.outputs.wiki_required }}
      full_validation: ${{ steps.gate.outputs.full_validation }}

    steps:
      - name: Checkout exact deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Determine deployment and validation mode
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mode=full
          pages_required=true
          wiki_required=false
          full_validation=true
          force_full_deploy=true
          source_pr=""
          source_head=""
          baseline_sha=""
          policy_json='{"mode":"full","reason":"manual-or-unresolved","pages_required":true,"wiki_required":false,"full_validation":true,"force_full_deploy":true}'

          if [[ "$EVENT_NAME" == "push" ]]; then
            successful_runs="$(gh api               "repos/$REPOSITORY/actions/workflows/pages.yml/runs?branch=bonaqu_projects&event=push&status=success&per_page=30")"
            baseline_sha="$(jq -r --arg head "$DEPLOY_SHA" '
              .workflow_runs
              | map(select(.head_sha != $head))
              | first
              | .head_sha // empty
            ' <<<"$successful_runs")"

            if [[ -n "$baseline_sha" ]] && git merge-base --is-ancestor "$baseline_sha" "$DEPLOY_SHA"; then
              mapfile -t changed_files < <(git diff --name-only "$baseline_sha" "$DEPLOY_SHA")
              deployment_sensitive=false
              for file in "${changed_files[@]}"; do
                case "$file" in
                  .github/workflows/*|.github/actions/*|scripts/build_pages.py|scripts/deploy_change_policy.py)
                    deployment_sensitive=true
                    ;;
                esac
              done

              if [[ "$deployment_sensitive" == "true" ]]; then
                mode=full
                pages_required=true
                wiki_required=false
                full_validation=true
                force_full_deploy=true
                policy_json='{"mode":"full","reason":"deployment-infrastructure-changed","pages_required":true,"wiki_required":false,"full_validation":true,"force_full_deploy":true}'
              else
                policy_json="$(printf '%s\n' "${changed_files[@]}" | python3 scripts/deploy_change_policy.py --stdin)"
                mode="$(jq -r '.mode' <<<"$policy_json")"
                pages_required="$(jq -r '.pages_required' <<<"$policy_json")"
                wiki_required="$(jq -r '.wiki_required' <<<"$policy_json")"
                full_validation="$(jq -r '.full_validation' <<<"$policy_json")"
                force_full_deploy="$(jq -r '.force_full_deploy' <<<"$policy_json")"
              fi

              echo "Last successful Pages deployment: $baseline_sha"
              printf 'Changed since deployed baseline (%d):\n' "${#changed_files[@]}"
              printf ' - %s\n' "${changed_files[@]}"
              echo "Policy: $policy_json"
            else
              echo "::notice::No trustworthy successful deployed ancestor was found; failing closed to full validation."
            fi

            if [[ "$mode" == "full" && "$force_full_deploy" != "true" ]]; then
              prs="$(gh api                 -H 'Accept: application/vnd.github+json'                 "repos/$REPOSITORY/commits/$DEPLOY_SHA/pulls")"

              source_pr="$(jq -r '
                map(select(.merged_at != null and .base.ref == "bonaqu_projects"))
                | first
                | .number // empty
              ' <<<"$prs")"

              if [[ -n "$source_pr" ]]; then
                pr="$(gh api "repos/$REPOSITORY/pulls/$source_pr")"
                source_head="$(jq -r '.head.sha' <<<"$pr")"
                runs="$(gh api                   "repos/$REPOSITORY/actions/workflows/feature-ci.yml/runs?head_sha=$source_head&event=pull_request&status=completed&per_page=20")"

                if jq -e '.workflow_runs | any(.conclusion == "success")' <<<"$runs" >/dev/null; then
                  full_validation=false
                  echo "Exact PR head $source_head passed Feature CI; reusing it and keeping only the production smoke gate."
                else
                  echo "No successful Feature CI found for exact PR head $source_head; keeping full production validation."
                fi
              else
                echo "No merged PR is associated with $DEPLOY_SHA; keeping full production validation."
              fi
            elif [[ "$mode" != "full" ]]; then
              echo "Safe documentation policy selected mode=$mode."
            elif [[ "$force_full_deploy" == "true" ]]; then
              echo "Deployment/build infrastructure changed; full production validation is mandatory."
            fi
          else
            echo "Manual deployment requested; keeping full production validation."
          fi

          {
            echo "mode=$mode"
            echo "pages_required=$pages_required"
            echo "wiki_required=$wiki_required"
            echo "full_validation=$full_validation"
            echo "force_full_deploy=$force_full_deploy"
            echo "source_pr=$source_pr"
            echo "source_head=$source_head"
            echo "baseline_sha=$baseline_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.pages_required == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up project Node runtime
        if: steps.gate.outputs.pages_required == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Verify committed preservation snapshot
        if: steps.gate.outputs.pages_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f .source-imported
          test -f SOURCE.lock
          test -f index.html
          test -d js
          test -d css
          test -d image
          echo "Preservation source is already committed; deployment will never mutate the source branch."

      - name: Run release-note fast checks
        if: steps.gate.outputs.mode == 'release-notes'
        run: >
          python -m unittest -v
          tests.test_repository_docs
          tests.test_build_pages
          tests.test_deploy_change_policy

      - name: Run production unit checks
        if: steps.gate.outputs.pages_required == 'true' && steps.gate.outputs.mode != 'release-notes'
        run: python -m unittest discover -s tests -v

      - name: Validate preservation snapshot
        if: steps.gate.outputs.pages_required == 'true' && steps.gate.outputs.mode != 'release-notes'
        run: python3 scripts/validate_site.py

      - name: Syntax-check legacy and Modern JavaScript
        if: steps.gate.outputs.pages_required == 'true' && steps.gate.outputs.mode != 'release-notes'
        shell: bash
        run: |
          set -euo pipefail
          for file in             js/calc.js js/equip.js js/item.js js/skill.js js/ini.js             modern/version.js modern/i18n.js modern/adapter.js modern/catalog.js modern/enhancement-effects.js             modern/admin-entry.js modern/calculator-labels.js modern/game-term-display.js             modern/build-store.js modern/search.js modern/equipment-picker.js             modern/calculator-controls.js modern/skill-controls.js modern/builds.js             modern/app-shell.js modern/tooltips.js modern/compare.js modern/mobile.js             modern/pwa.js modern/service-worker.js scripts/lib/legacy-runtime.mjs             scripts/serve_pages.mjs scripts/extract_legacy_terms.mjs scripts/extract_legacy_data.mjs
          do
            node --check "$file"
          done

      - name: Build Modern and Legacy Pages routes
        if: steps.gate.outputs.pages_required == 'true'
        run: python3 scripts/build_pages.py --output _site

      - name: Verify Pages defaults to English
        if: steps.gate.outputs.pages_required == 'true'
        run: python3 scripts/check_default_language.py _site/index.html

      - name: Validate generated What's new payload
        if: steps.gate.outputs.pages_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --check _site/modern/release-notes.js
          node <<'NODE'
          global.window = {};
          require('./_site/modern/release-notes.js');
          const release = global.window.PandoraRemakedRelease;
          if (!release || !release.version || !release.notes?.ru || !release.notes?.en) {
            throw new Error('Generated release notes are incomplete.');
          }
          const publicText = JSON.stringify(release);
          for (const token of ['Pandora Saga OS', 'itemForth', 'unison', 'gamedata/', '.json']) {
            if (publicText.includes(token)) throw new Error('Public release notes expose internal data source: ' + token);
          }
          console.log('Generated release notes OK:', release.version);
          NODE

      - name: Syntax-check recovered archived codecs
        if: steps.gate.outputs.pages_required == 'true' && steps.gate.outputs.mode != 'release-notes'
        run: |
          node --check _site/js/base64.js
          node --check _site/js/rawinflate.js
          node --check _site/js/rawdeflate.js

      - name: Install browser test dependencies
        if: steps.gate.outputs.pages_required == 'true' && steps.gate.outputs.mode != 'release-notes'
        run: npm ci --no-audit --no-fund

      - name: Run lightweight production smoke gate with runner Chrome
        if: steps.gate.outputs.pages_required == 'true' && steps.gate.outputs.mode != 'release-notes'
        env:
          PW_USE_SYSTEM_CHROME: '1'
        run: >
          npx playwright test
          tests/ui/modern-foundation.spec.mjs
          --project=chromium
          --grep
          "Modern shell exposes meaningful navigation and defaults to English|Modern and Legacy routes load without missing local assets"

      - name: Install bundled browsers for fallback validation
        if: steps.gate.outputs.full_validation == 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run complete desktop workspace contract on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: npm run test:ui:desktop -- --project=chromium

      - name: Run shipped browser contract tests on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: npm run test:ui:ci -- --project=chromium

      - name: Audit every selectable source catalog record on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: npm run test:ui:catalog-audit

      - name: Verify versioned catalog calculations on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: >
          npm run test:ui --
          tests/ui/catalog-adapter.spec.mjs
          tests/ui/catalog-adoption.spec.mjs
          tests/ui/build-load-races.spec.mjs
          tests/ui/skill-catalog.spec.mjs
          tests/ui/skill-variants.spec.mjs
          tests/ui/custom-skill-learning.spec.mjs
          tests/ui/skill-profiles.spec.mjs
          tests/ui/native-passive-effects.spec.mjs
          tests/ui/build-context.spec.mjs
          tests/ui/admin-entry.spec.mjs
          --project=chromium

      - name: Run cross-browser smoke tests on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: npm run test:ui:cross-browser

      - name: Run visual QA on untrusted push
        if: steps.gate.outputs.full_validation == 'true'
        run: npm run test:ui:visual -- --project=chromium

      - name: Verify deterministic lightweight projections
        if: steps.gate.outputs.full_validation == 'true'
        run: |
          npm run test:translations
          npm run test:source-audit
          npm run test:data

      - name: Report validation path
        run: |
          echo "mode=${{ steps.gate.outputs.mode }}"
          echo "pages_required=${{ steps.gate.outputs.pages_required }}"
          echo "wiki_required=${{ steps.gate.outputs.wiki_required }}"
          echo "full_validation=${{ steps.gate.outputs.full_validation }}"
          echo "baseline_sha=${{ steps.gate.outputs.baseline_sha }}"
          echo "source_pr=${{ steps.gate.outputs.source_pr }}"
          echo "source_head=${{ steps.gate.outputs.source_head }}"

      - name: Configure GitHub Pages
        if: steps.gate.outputs.pages_required == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.gate.outputs.pages_required == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.result == 'success' && needs.build.outputs.pages_required == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  wiki:
    needs:
      - build
      - deploy
    if: >-
      always() &&
      needs.build.result == 'success' &&
      needs.build.outputs.wiki_required == 'true' &&
      (needs.build.outputs.pages_required != 'true' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout documentation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Best-effort sync documentation to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          wiki_dir="$(mktemp -d)/wiki"
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          git clone "$wiki_url" "$wiki_dir"
          clone_status=$?
          if [[ $clone_status -ne 0 ]]; then
            echo "::notice::Wiki git repository is not initialized or the workflow token cannot write it. Canonical docs remain in /docs."
            exit 0
          fi

          rm -f "$wiki_dir/test.md" "$wiki_dir/Test.md"

          cp docs/wiki/Home.md "$wiki_dir/Home.md"
          cp docs/FAQ.md "$wiki_dir/FAQ.md"
          cp docs/ARCHITECTURE.md "$wiki_dir/Architecture.md"
          cp docs/DEPLOYMENT.md "$wiki_dir/Deployment.md"
          cp docs/HISTORY.md "$wiki_dir/History.md"
          cp docs/TASK_QUEUE.ru.md "$wiki_dir/Roadmap.md"
          cp CHANGELOG.md "$wiki_dir/Changelog.md"

          cd "$wiki_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki already matches repository documentation."
            exit 0
          fi

          git commit -m "docs: sync preservation wiki"
          git push origin HEAD
          push_status=$?
          if [[ $push_status -ne 0 ]]; then
            echo "::notice::Wiki sync could not push; simulator deployment is unaffected."
          fi
          exit 0
