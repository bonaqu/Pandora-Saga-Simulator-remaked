name: Deploy Pandora Saga Simulator

on:
  push:
    branches:
      - bonaqu_projects
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: https://github.com/palver1/Pandora_saga_tools.git
  SOURCE_COMMIT: 2a2417335f8dd8145c4558f663ca6a0746ca70c6
  SOURCE_PATH: ps_simulator/PSS_original

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout preservation repository
        uses: actions/checkout@v7
        with:
          ref: bonaqu_projects
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up project Node runtime
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Import recovered simulator once
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f .source-imported ]]; then
            echo "Recovered simulator is already committed locally; skipping upstream import."
            exit 0
          fi

          workdir="$(mktemp -d)"
          source_dir="$workdir/source"

          git init "$source_dir"
          git -C "$source_dir" remote add origin "$SOURCE_REPOSITORY"
          git -C "$source_dir" sparse-checkout init --cone
          git -C "$source_dir" sparse-checkout set "$SOURCE_PATH"
          git -C "$source_dir" fetch --depth 1 origin "$SOURCE_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD

          recovered="$source_dir/$SOURCE_PATH"
          test -f "$recovered/Pandora Saga Simulator.htm"
          test -d "$recovered/js"
          test -d "$recovered/css"
          test -d "$recovered/image"

          rm -rf css js image
          cp -a "$recovered/css" ./css
          cp -a "$recovered/js" ./js
          cp -a "$recovered/image" ./image
          cp "$recovered/Pandora Saga Simulator.htm" ./index.html

          python3 scripts/strip_fc2_injection.py index.html

          cat > SOURCE.lock <<EOF
          source_repository=$SOURCE_REPOSITORY
          source_commit=$SOURCE_COMMIT
          source_path=$SOURCE_PATH
          original_url=http://pansaga3.web.fc2.com/simu/
          imported_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          touch .source-imported

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .source-imported SOURCE.lock index.html css js image

          if git diff --cached --quiet; then
            echo "Nothing to commit after import."
          else
            git commit -m "preservation: import original Pandora Saga Simulator snapshot"
            git push origin HEAD:bonaqu_projects
          fi

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Validate preservation snapshot
        run: python3 scripts/validate_site.py

      - name: Syntax-check legacy and Modern JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check js/calc.js
          node --check js/equip.js
          node --check js/item.js
          node --check js/skill.js
          node --check js/ini.js
          node --check modern/version.js
          node --check modern/i18n.js
          node --check modern/adapter.js
          node --check modern/catalog.js
          node --check modern/admin-entry.js
          node --check modern/calculator-labels.js
          node --check modern/game-term-display.js
          node --check modern/build-store.js
          node --check modern/search.js
          node --check modern/equipment-picker.js
          node --check modern/calculator-controls.js
          node --check modern/skill-controls.js
          node --check modern/builds.js
          node --check modern/app-shell.js
          node --check modern/tooltips.js
          node --check modern/compare.js
          node --check modern/mobile.js
          node --check modern/pwa.js
          node --check modern/service-worker.js
          node --check scripts/lib/legacy-runtime.mjs
          node --check scripts/serve_pages.mjs
          node --check scripts/extract_legacy_terms.mjs
          node --check scripts/extract_legacy_data.mjs

      - name: Build Modern and Legacy Pages routes
        run: python3 scripts/build_pages.py --output _site

      - name: Verify Pages defaults to English
        run: python3 scripts/check_default_language.py _site/index.html

      - name: Syntax-check recovered archived codecs
        run: |
          node --check _site/js/base64.js
          node --check _site/js/rawinflate.js
          node --check _site/js/rawdeflate.js

      - name: Install browser test dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run shipped browser contract tests
        run: npm run test:ui:ci

      - name: Verify versioned catalog calculations and offline recipients
        run: npm run test:ui -- tests/ui/catalog-adapter.spec.mjs tests/ui/skill-catalog.spec.mjs tests/ui/admin-entry.spec.mjs --project=chromium

      - name: Run Chromium Firefox and WebKit smoke tests
        run: npm run test:ui:cross-browser

      - name: Verify deterministic Legacy terminology export
        run: npm run test:translations

      - name: Verify deterministic structured data projections
        run: npm run test:data

      - name: Run visual QA capture
        run: npm run test:ui:visual

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  wiki:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout documentation
        uses: actions/checkout@v7
        with:
          ref: bonaqu_projects

      - name: Best-effort sync documentation to GitHub Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          wiki_dir="$(mktemp -d)/wiki"
          wiki_url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"

          git clone "$wiki_url" "$wiki_dir"
          clone_status=$?
          if [[ $clone_status -ne 0 ]]; then
            echo "::notice::Wiki git repository is not initialized or the workflow token cannot write it. Canonical docs remain in /docs."
            exit 0
          fi

          rm -f "$wiki_dir/test.md" "$wiki_dir/Test.md"

          cp docs/wiki/Home.md "$wiki_dir/Home.md"
          cp docs/FAQ.md "$wiki_dir/FAQ.md"
          cp docs/ARCHITECTURE.md "$wiki_dir/Architecture.md"
          cp docs/DEPLOYMENT.md "$wiki_dir/Deployment.md"
          cp docs/HISTORY.md "$wiki_dir/History.md"

          cd "$wiki_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki already matches repository documentation."
            exit 0
          fi

          git commit -m "docs: sync preservation wiki"
          git push origin HEAD
          push_status=$?
          if [[ $push_status -ne 0 ]]; then
            echo "::notice::Wiki sync could not push; simulator deployment is unaffected."
          fi
          exit 0
