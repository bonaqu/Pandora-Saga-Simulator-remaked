name: Cloudflare Admin API

on:
  pull_request:
    paths: ['admin-api/**', 'tests/admin/**', 'data/generated/**', 'data/modern-astir-rules.json', 'data/native-passive-hooks.v1.json', 'data/current-active-profiles.v1.json', 'localization/ui.en.json', 'localization/approved-translations.v1.json', 'localization/curated-runtime-defaults.ru.v1.json', 'localization/game-terms.ru.json', 'localization/guild-skills.v1.json', 'scripts/create_first_admin.mjs', 'scripts/materialize_pandora_os_sync.mjs', 'scripts/materialize_pandora_os_live_sync.mjs', 'scripts/materialize_pandora_os_live_sync_hardening.mjs', 'scripts/materialize_pandora_os_complete_sync.mjs', 'scripts/materialize_pandora_os_identity_reconcile.mjs', 'scripts/materialize_decorative_equipment_prune.mjs', 'scripts/lib/wrangler-json.mjs', 'package.json', 'package-lock.json', '.github/workflows/admin-api.yml']
  push:
    branches: [bonaqu_projects]
    paths: ['admin-api/**', 'tests/admin/**', 'data/generated/**', 'data/modern-astir-rules.json', 'data/native-passive-hooks.v1.json', 'data/current-active-profiles.v1.json', 'localization/ui.en.json', 'localization/approved-translations.v1.json', 'localization/curated-runtime-defaults.ru.v1.json', 'localization/game-terms.ru.json', 'localization/guild-skills.v1.json', 'scripts/create_first_admin.mjs', 'scripts/materialize_pandora_os_sync.mjs', 'scripts/materialize_pandora_os_live_sync.mjs', 'scripts/materialize_pandora_os_live_sync_hardening.mjs', 'scripts/materialize_pandora_os_complete_sync.mjs', 'scripts/materialize_pandora_os_identity_reconcile.mjs', 'scripts/materialize_decorative_equipment_prune.mjs', 'scripts/lib/wrangler-json.mjs', 'package.json', 'package-lock.json', '.github/workflows/admin-api.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:admin
      - run: node --check scripts/create_first_admin.mjs
      - run: npm run admin:check

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/bonaqu_projects' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: cloudflare-admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify Cloudflare deployment identity without printing credentials
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply additive D1 migrations
        run: npm run admin:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker while retaining its Cloudflare Secrets
        run: npm run admin:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed health route
        run: |
          node --input-type=module -e 'const r = await fetch("https://pandora-saga-simulator-remaked-admin-api.bonaqu.workers.dev/health"); const j = await r.json(); if (!r.ok || j.ok !== true || j.service !== "pandora-admin-api") throw new Error("Worker health failed"); console.log("Worker health passed");'
      - name: Verify every deployed admin JavaScript asset is reachable
        run: |
          node --input-type=module <<'NODE'
          const base = "https://pandora-saga-simulator-remaked-admin-api.bonaqu.workers.dev";
          const htmlReply = await fetch(base + "/admin", {cache:"no-store"});
          if (!htmlReply.ok) throw new Error("Published admin HTML unavailable");
          const html = await htmlReply.text();
          const scripts = [...html.matchAll(/<script\s+src="(\/[^"]+\.js)"\s+defer><\/script>/g)]
            .map(match => match[1]);
          if (!scripts.includes("/localization-four-language.js") || scripts.length < 6)
            throw new Error("Published admin HTML is missing runtime scripts");
          for (const route of scripts) {
            const result = await fetch(base + route, {cache:"no-store"});
            if (!result.ok || !/javascript/i.test(result.headers.get("content-type") || ""))
              throw new Error("Admin script unavailable: " + route + " HTTP " + result.status);
          }
          console.log("Published admin script routes verified:", scripts.length);
          NODE
      - name: Verify deployed catalog revision and Astir localization
        run: |
          node --input-type=module <<'NODE'
          const base = "https://pandora-saga-simulator-remaked-admin-api.bonaqu.workers.dev";
          const headResponse = await fetch(base + "/api/catalog/head");
          const head = await headResponse.json();
          if (!headResponse.ok || head.ok !== true || head.revision < 86 || head.impactRevision < 86)
            throw new Error("Unexpected deployed catalog head: " + JSON.stringify(head));
          const catalogResponse = await fetch(base + "/api/catalog");
          const catalog = await catalogResponse.json();
          if (!catalogResponse.ok || catalog.ok !== true || catalog.revision !== head.revision || !Array.isArray(catalog.records))
            throw new Error("Unexpected deployed catalog payload");
          const astir = catalog.records.filter(record => /astir|астир/i.test([
            record?.names?.en, record?.names?.ru, record?.description?.en, record?.description?.ru
          ].filter(Boolean).join(" ")));
          const scarlet = catalog.records.find(record =>
            record?.names?.en === "Astian Scarlet Coat" && record?.names?.ru === "Алая астирская куртка");
          const unavailableAstir = catalog.records.find(record =>
            record?.names?.en === "Adept Glasses" && record?.names?.ru === "Очки");
          if (astir.length < 58 || !scarlet || !unavailableAstir)
            throw new Error("Astir localization/catalog verification failed: " + JSON.stringify({ count: astir.length, scarlet: !!scarlet, unavailableAstir: !!unavailableAstir }));
          const decorativeIds = new Set([
            "modern.equipment.fb8f9028-d194-43c2-a143-89048e89fd0f",
            "modern.equipment.3db45d2c-5301-46f4-a9de-7438e57018f8",
            "modern.equipment.1fe290c8-9bbb-40fe-aa40-055cef1e7ab0",
            "modern.equipment.a7145ba2-78ab-47c8-a863-5a024873522c",
            "modern.equipment.9c66a663-f7e8-4677-a7fb-02b57fd1736f",
            "modern.equipment.218e08bb-1154-4c9a-a6f6-365805690ccc"
          ]);
          const decorative = catalog.records.filter(record => decorativeIds.has(record?.id));
          if (decorative.length)
            throw new Error("Decorative equipment is still published: " + decorative.map(record => record.id).join(", "));
          console.log(JSON.stringify({ revision: head.revision, impactRevision: head.impactRevision, records: catalog.records.length, astirRecords: astir.length, decorativeRecords: decorative.length }));
          NODE
      - name: Verify published Honor names and descriptions match approved translations
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const approved=JSON.parse(readFileSync('admin-api/data/honor-ru-20261010.json','utf8'));
          const api='https://pandora-saga-simulator-remaked-admin-api.bonaqu.workers.dev/api/localization';
          const response=await fetch(api,{cache:'no-store'});
          const payload=await response.json();
          if(!response.ok||payload.ok!==true||payload.schemaVersion!==1)
            throw new Error('Published localization is unavailable');
          const ru=payload.overrides?.game?.ru||{};
          for(const row of approved.entries){
            if(ru[row.id]!==row.ruName||ru[row.id+'.hint']!==row.ruHint)
              throw new Error('D1 Honor mismatch: '+row.id);
          }
          console.log('D1 approved Honor localization: 13 names and 13 hints verified');
          NODE
