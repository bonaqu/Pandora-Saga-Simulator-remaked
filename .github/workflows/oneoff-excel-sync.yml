name: One-time approved Excel sync
on:
  push:
    branches: ['chore/modern-344-excel-admin-ux-20261009']
    paths: ['.github/workflows/oneoff-excel-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'bonaqu/Pandora-Saga-Simulator-remaked'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Transfer seven validated workbook values
        run: python3 scripts/oneoff_excel_merge.py
      - name: Verify workbook invariants and stable IDs
        run: |
          python3 scripts/translation_workbook.py
          git diff --check
      - name: Commit workbook to the same working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- localization/translations.xlsx
          git diff --cached --quiet && exit 1
          git commit -m 'fix(i18n): sync seven approved Russian terms to translations.xlsx'
          git push origin HEAD:chore/modern-344-excel-admin-ux-20261009
