name: "⚔️ Ошибка механики / формулы"
description: "Неверная механика, расчёт или формула / Incorrect mechanic, calculation or formula"
title: "[MECHANICS] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## ⚔️ Ошибка механики / формулы
        ## ⚔️ Mechanics / formula issue

        Этот шаблон предназначен для неверных расчётов характеристик, пассивок, навыков, урона и других игровых механик.
        Use this form for incorrect stat calculations, passives, skills, damage formulas, and other game mechanics.

  - type: dropdown
    id: category
    attributes:
      label: "Раздел / Category"
      options:
        - "Раса / Race"
        - "Расовая пассивка / Racial passive"
        - "Класс / Class"
        - "Характеристики / Stats"
        - "Навык / Skill"
        - "Экипировка / Equipment"
        - "Урон / Damage"
        - "Критический удар / Critical hit"
        - "Сопротивления / Resistances"
        - "Другая механика / Other mechanic"
    validations:
      required: true

  - type: input
    id: mechanic
    attributes:
      label: "Название механики / Mechanic name"
      placeholder: "Например: Каменная кожа / Example: Stone Skin"
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: "Исходные данные / Input values"
      description: "Укажите всё, что влияет на расчёт. / Include everything relevant to the calculation."
      placeholder: |
        Раса / Race:
        Класс / Class:
        Уровень / Level:
        Характеристики / Stats:
        Навыки / Skills:
        Пассивки / Passives:
        Экипировка / Equipment:
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Что считает симулятор сейчас? / Current simulator result"
      placeholder: "Текущее значение или результат расчёта / Current calculated value or result"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Как должно считаться? / Expected calculation"
      description: "Укажите ожидаемый результат и, если известно, формулу. / Provide the expected result and formula if known."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Как воспроизвести в симуляторе? / Reproduction steps"
      placeholder: |
        1. Выбрать / Select ...
        2. Установить / Set ...
        3. Проверить / Check ...
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "Дополнительная информация / Additional context"

  - type: checkboxes
    id: checks
    attributes:
      label: "Проверка / Checklist"
      options:
        - label: "Я проверил(а), что такой Issue ещё не создан. / I checked that this issue has not already been reported."
          required: true
