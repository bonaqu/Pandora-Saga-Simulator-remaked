name: "📚 Ошибка данных / перевода"
description: "Неверное название, перевод, значение или игровые данные / Incorrect name, translation, value or game data"
title: "[DATA] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 📚 Ошибка данных / перевода
        ## 📚 Data / translation issue

        Этот шаблон подходит для неправильных названий, переводов, описаний, числовых значений и других данных.
        Use this form for incorrect names, translations, descriptions, numeric values, and other game data.

  - type: dropdown
    id: data_type
    attributes:
      label: "Тип данных / Data type"
      options:
        - "Перевод / Translation"
        - "Название / Name"
        - "Описание / Description"
        - "Раса / Race"
        - "Класс / Class"
        - "Навык / Skill"
        - "Пассивка / Passive"
        - "Предмет / Item"
        - "Числовое значение / Numeric value"
        - "Другое / Other"
    validations:
      required: true

  - type: dropdown
    id: simulator_language
    attributes:
      label: "Где ошибка? / Affected simulator language"
      options:
        - "English"
        - "Japanese / 日本語"
        - "Traditional Chinese / 繁體中文"
        - "Несколько языков / Multiple languages"
        - "Не относится к языку / Not language-specific"
    validations:
      required: true

  - type: input
    id: entry
    attributes:
      label: "Название записи / Entry name"
      placeholder: "Название навыка, предмета, пассивки и т.п. / Skill, item, passive, etc."
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: "Что указано сейчас? / Current data"
      placeholder: "Текущий текст, перевод или значение / Current text, translation, or value"
    validations:
      required: true

  - type: textarea
    id: correct
    attributes:
      label: "Как должно быть? / Correct data"
      placeholder: "Правильный текст, перевод или значение / Correct text, translation, or value"
    validations:
      required: true

  - type: textarea
    id: source
    attributes:
      label: "Источник / Source"
      description: "По возможности приложите ссылку, скриншот из игры, wiki или другой источник. / If possible, add a link, in-game screenshot, wiki, or another source."

  - type: textarea
    id: screenshots
    attributes:
      label: "Скриншоты / Screenshots"

  - type: textarea
    id: additional
    attributes:
      label: "Дополнительная информация / Additional context"

  - type: checkboxes
    id: checks
    attributes:
      label: "Проверка / Checklist"
      options:
        - label: "Я проверил(а), что такой Issue ещё не создан. / I checked that this issue has not already been reported."
          required: true
