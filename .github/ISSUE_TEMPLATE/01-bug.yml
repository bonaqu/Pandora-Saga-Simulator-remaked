name: "🐛 Баг / Bug"
description: "Сообщить о воспроизводимой ошибке / Report a reproducible problem"
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Баг / Bug report

        Спасибо, что помогаете улучшать Pandora Saga Simulator.
        Thanks for helping improve Pandora Saga Simulator.

        Если проблема относится именно к формулам, интерфейсу или данным/переводу, лучше выбрать соответствующий шаблон.
        If the problem is specifically about formulas, UI, or data/translation, please use the dedicated form.

  - type: input
    id: browser
    attributes:
      label: "Браузер и версия / Browser and version"
      placeholder: "Chrome 152 / Firefox / Edge / etc."

  - type: dropdown
    id: simulator_language
    attributes:
      label: "Язык симулятора / Simulator language"
      options:
        - "English"
        - "Japanese / 日本語"
        - "Traditional Chinese / 繁體中文"
        - "Другое / Other"
        - "Не имеет значения / Not relevant"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Что произошло? / What happened?"
      description: "Кратко опишите проблему. / Briefly describe the problem."
      placeholder: |
        RU: Что именно работает неправильно?
        EN: What exactly is not working correctly?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Как воспроизвести? / Steps to reproduce"
      placeholder: |
        1. Открыть / Open ...
        2. Выбрать / Select ...
        3. Нажать / Click ...
        4. Получить / Result ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Ожидаемый результат / Expected result"
      placeholder: "Как должно работать? / What should happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Фактический результат / Actual result"
      placeholder: "Что происходит сейчас? / What happens instead?"
    validations:
      required: true

  - type: textarea
    id: build
    attributes:
      label: "Персонаж / билд, если относится к проблеме / Character or build, if relevant"
      description: "Класс, раса, уровень, характеристики, экипировка, навыки и пассивки. / Class, race, level, stats, equipment, skills and passives."

  - type: textarea
    id: evidence
    attributes:
      label: "Скриншоты, видео или логи / Screenshots, video or logs"
      description: "Перетащите файлы сюда или вставьте ошибки консоли браузера. / Drag files here or paste relevant browser console errors."

  - type: checkboxes
    id: checks
    attributes:
      label: "Проверка / Checklist"
      options:
        - label: "Я проверил(а), что такой Issue ещё не создан. / I checked that this issue has not already been reported."
          required: true
